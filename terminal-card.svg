      </text>
      <text x="95.5" y="0" fill="#f0f6fc" font-size="12" font-weight="600" opacity="0">
        i
        <set attributeName="opacity" to="1" begin="2.490s" fill="freeze" />
      </text>
      <!-- Moving Cursor during whoami -->
      <rect x="58" y="-10" width="7" height="13" fill="#ffffff" opacity="0">
        <set attributeName="opacity" to="1" begin="2.090s" fill="freeze" />
        <animate attributeName="x" from="58" to="103.0" dur="0.480s" begin="2.090s" fill="freeze" />
        <set attributeName="opacity" to="0" begin="2.570s" fill="freeze" />
      </rect>
    </g>
    <!-- Command Output (Full Name) -->
    <g transform="translate(26, 416)">
      <text font-size="13" font-weight="700" fill="#00f0ff" opacity="0" filter="url(#cursor-glow)">
        <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.820s" fill="freeze" />
        Shamil Shiras A
      </text>
    </g>
