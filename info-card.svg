      <rect x="28" y="382" width="18" height="10" rx="2" fill="#161b22" /> <rect x="28" y="395" width="18" height="10" rx="2" fill="#30363d" /> <rect x="51" y="382" width="18" height="10" rx="2" fill="#ff5555" /> <rect x="51" y="395" width="18" height="10" rx="2" fill="#ff6e6e" /> <rect x="74" y="382" width="18" height="10" rx="2" fill="#50fa7b" /> <rect x="74" y="395" width="18" height="10" rx="2" fill="#69ff94" /> <rect x="97" y="382" width="18" height="10" rx="2" fill="#f1fa8c" /> <rect x="97" y="395" width="18" height="10" rx="2" fill="#ffffa5" /> <rect x="120" y="382" width="18" height="10" rx="2" fill="#bd93f9" /> <rect x="120" y="395" width="18" height="10" rx="2" fill="#d6acff" /> <rect x="143" y="382" width="18" height="10" rx="2" fill="#ff79c6" /> <rect x="143" y="395" width="18" height="10" rx="2" fill="#ff92df" /> <rect x="166" y="382" width="18" height="10" rx="2" fill="#8be9fd" /> <rect x="166" y="395" width="18" height="10" rx="2" fill="#a4ffff" /> <rect x="189" y="382" width="18" height="10" rx="2" fill="#f8f8f2" /> <rect x="189" y="395" width="18" height="10" rx="2" fill="#ffffff" />
