<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;">
  <defs>
    <!-- Card background gradient -->
    <linearGradient id="info-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0d1117" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#090d12" stop-opacity="1" />
    </linearGradient>

    <!-- Neon border gradient -->
    <linearGradient id="info-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.6" />
    </linearGradient>

    <!-- Header bar subtle gradient -->
    <linearGradient id="info-header-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="info-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="438" height="468" rx="14" ry="14" fill="url(#info-bg)" stroke="url(#info-border)" stroke-width="1.2" />

  <!-- Inner glass edge -->
  <rect x="2" y="2" width="436" height="466" rx="13" ry="13" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- macOS Window Header -->
  <path d="M 2 15 A 13 13 0 0 1 15 2 L 425 2 A 13 13 0 0 1 438 15 L 438 36 L 2 36 Z" fill="url(#info-header-bg)" />
  <line x1="2" y1="36" x2="438" y2="36" stroke="#30363d" stroke-width="0.8" />

  <!-- Window Control Buttons (macOS Traffic Lights) -->
  <circle cx="20" cy="19" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="38" cy="19" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="56" cy="19" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="220" y="23" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="500" letter-spacing="0.3">shamilshiras@cyberdeck: ~ (neofetch)</text>

