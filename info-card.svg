<svg xmlns="http://www.w3.org/2000/svg" width="840.0" height="500.0" viewBox="0 0 840.0 500.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="info-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111722" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="840.0" height="500.0" rx="12" fill="url(#info-bg)" />
  <rect x="0.5" y="0.5" width="839.0" height="499.0" rx="12" fill="none" stroke="#30363d" stroke-width="1" />

  <!-- macOS Titlebar -->
  <line x1="0" y1="36.0" x2="840.0" y2="36.0" stroke="#30363d" stroke-width="1" />
  <circle cx="24" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="44" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="64" cy="18" r="5.5" fill="#27c93f" />
  <text x="420.0" y="22" fill="#7d8590" font-size="13" font-weight="500" text-anchor="middle">About me</text>

  <!-- Neofetch Content Body with Staggered Slide-Up & Fade-In -->
  <g id="neofetch-lines">
    <g opacity="0" transform="translate(0, 12)">
      <animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.200s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.28s" begin="0.200s" fill="freeze" />
      <text x="44.0" y="82.0" fill="#38bdf8" font-size="26" font-weight="700">shamilshiras</text>
    </g>
    <g opacity="0" transform="translate(0, 12)">
      <animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.265s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.28s" begin="0.265s" fill="freeze" />
      <text x="44.0" y="138.0" fill="#f0883e" font-size="19" font-weight="600">Now        </text>
      <text x="194.0" y="138.0" fill="#e6edf3" font-size="19" font-weight="400">Python Developer (Backend &amp; ML)</text>
    </g>
    <g opacity="0" transform="translate(0, 12)">
      <animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.330s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.28s" begin="0.330s" fill="freeze" />
      <text x="44.0" y="170.0" fill="#f0883e" font-size="19" font-weight="600">Edu        </text>
      <text x="194.0" y="170.0" fill="#e6edf3" font-size="19" font-weight="400">B.Tech CS &amp; Design, Vimal Jyothi '26</text>
    </g>
    <g opacity="0" transform="translate(0, 12)">
      <animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.395s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.28s" begin="0.395s" fill="freeze" />
      <text x="44.0" y="202.0" fill="#f0883e" font-size="19" font-weight="600">Loc        </text>
      <text x="194.0" y="202.0" fill="#e6edf3" font-size="19" font-weight="400">Kerala, India</text>
    </g>
    <g opacity="0" transform="translate(0, 12)">
      <animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.460s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.28s" begin="0.460s" fill="freeze" />
      <text x="44.0" y="252.0" fill="#38bdf8" font-size="22" font-weight="700">- Stack</text>
    </g>
    <g opacity="0" transform="translate(0, 12)">
      <animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.525s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.28s" begin="0.525s" fill="freeze" />
      <text x="44.0" y="286.0" fill="#f0883e" font-size="19" font-weight="600">Languages  </text>
      <text x="194.0" y="286.0" fill="#e6edf3" font-size="19" font-weight="400">Python, JavaScript, SQL</text>
    </g>
    <g opacity="0" transform="translate(0, 12)">
      <animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.590s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.28s" begin="0.590s" fill="freeze" />
      <text x="44.0" y="318.0" fill="#f0883e" font-size="19" font-weight="600">Backend    </text>
      <text x="194.0" y="318.0" fill="#e6edf3" font-size="19" font-weight="400">Django, Django REST Framework, ORM</text>
    </g>
    <g opacity="0" transform="translate(0, 12)">
      <animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.655s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.28s" begin="0.655s" fill="freeze" />
      <text x="44.0" y="350.0" fill="#f0883e" font-size="19" font-weight="600">AI / ML    </text>
      <text x="194.0" y="350.0" fill="#e6edf3" font-size="19" font-weight="400">NLP, IndicBERT/MuRIL, Scikit-learn, Pandas</text>
    </g>
    <g opacity="0" transform="translate(0, 12)">
      <animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.720s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.28s" begin="0.720s" fill="freeze" />
      <text x="44.0" y="382.0" fill="#f0883e" font-size="19" font-weight="600">DevOps     </text>
      <text x="194.0" y="382.0" fill="#e6edf3" font-size="19" font-weight="400">Docker, Apache Airflow, Git, Postman</text>
    </g>
    <g opacity="0" transform="translate(0, 12)">
      <animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.785s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.28s" begin="0.785s" fill="freeze" />
      <text x="44.0" y="414.0" fill="#f0883e" font-size="19" font-weight="600">Database   </text>
      <text x="194.0" y="414.0" fill="#e6edf3" font-size="19" font-weight="400">MySQL, SQLite, Relational SQL</text>
    </g>
  </g>

  <!-- Interactive Terminal Prompt at bottom -->
  <g transform="translate(44.0, 858.0)">
    <text fill="#7d8590" font-size="13" font-weight="500">
    </text>
    <rect x="200" y="-11" width="7" height="13" fill="#39d353">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="1.110s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
